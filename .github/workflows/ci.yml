name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app tools main.py tests
      - name: Generate app icon
        run: python tools/build_app_icon.py
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build one-file EXE
        shell: powershell
        run: .\build.ps1
      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "dist\叫家琦来.exe")) {
            throw "dist\叫家琦来.exe was not created"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JiaqiCleaner-Windows
          path: dist/叫家琦来.exe
          retention-days: 7
