name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q app tools main.py tests
      - name: Generate app icon
        run: python tools/build_app_icon.py
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build one-file EXE
        shell: powershell
        run: .\build.ps1
      - name: Verify executable
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No packaged EXE was created"
          }
          Write-Host "Packaged EXE: $($exe.Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: JiaqiCleaner-Windows
          path: dist/*.exe
          retention-days: 7
